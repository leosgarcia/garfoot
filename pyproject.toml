[project]
name = "garfoot"
version = "0.1.0"
description = "Gerenciador de futebol retro em modo texto."
requires-python = ">=3.11"
dependencies = ["textual>=0.86", "PySide6>=6.7"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "slow: testes estatisticos com muitas simulacoes",
]
